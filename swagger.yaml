openapi: 3.0.0
info:
  title: API UnaHur Anti-Social Net - TP2 (MongoDB / Mongoose)
  description: Documentación oficial de la API REST para la red social UnaHur Anti-Social Net (TP2) con soporte de caché en Redis y almacenamiento de imágenes físicas mediante Multer.
  version: 2.0.0
servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo local
tags:
  - name: Users
    description: Operaciones sobre usuarios
  - name: Followers
    description: Gestión de relaciones entre usuarios (seguidores y seguidos)
  - name: Posts
    description: Operaciones sobre publicaciones e imágenes (con caché Redis)
  - name: Tags
    description: Gestión de etiquetas de publicaciones
  - name: Comments
    description: Operaciones sobre comentarios asociados a publicaciones
paths:
  # -------------------------------------------------------------------
  # RECURSO: USUARIOS (/users)
  # -------------------------------------------------------------------
  /users:
    get:
      summary: Obtener todos los usuarios
      tags:
        - Users
      responses:
        '200':
          description: Lista de usuarios obtenida exitosamente
        '500':
          description: Error interno del servidor
    post:
      summary: Crear un nuevo usuario
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nickName
                - nombre
                - email
                - contraseña
              properties:
                nickName:
                  type: string
                  example: "juanperez"
                nombre:
                  type: string
                  example: "Juan Pérez"
                email:
                  type: string
                  example: "juan@example.com"
                contraseña:
                  type: string
                  example: "Secreta123!"
      responses:
        '201':
          description: Usuario creado exitosamente
        '400':
          description: Datos de entrada inválidos o nickName/email ya registrado
        '500':
          description: Error interno del servidor

  /users/{nickName}:
    get:
      summary: Obtener un usuario por su nickName
      tags:
        - Users
      parameters:
        - in: path
          name: nickName
          required: true
          schema:
            type: string
          description: NickName único del usuario
      responses:
        '200':
          description: Usuario encontrado
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor
    patch:
      summary: Actualizar datos de un usuario por su nickName
      tags:
        - Users
      parameters:
        - in: path
          name: nickName
          required: true
          schema:
            type: string
          description: NickName del usuario a actualizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                  example: "Juan Pedro Pérez"
                email:
                  type: string
                  example: "juan.perez@example.com"
                contraseña:
                  type: string
                  example: "NuevaClave123!"
      responses:
        '200':
          description: Usuario actualizado exitosamente
        '400':
          description: Datos de entrada inválidos
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Eliminar un usuario por su nickName
      description: Elimina el usuario y en cascada sus publicaciones, comentarios y conexiones de seguimiento.
      tags:
        - Users
      parameters:
        - in: path
          name: nickName
          required: true
          schema:
            type: string
          description: NickName del usuario a eliminar
      responses:
        '200':
          description: Usuario eliminado con éxito
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor

  # -------------------------------------------------------------------
  # RECURSO: SEGUIDORES (/users/{nickName}/...)
  # -------------------------------------------------------------------
  /users/{nickName}/followers:
    get:
      summary: Obtener todos los seguidores de un usuario
      tags:
        - Followers
      parameters:
        - in: path
          name: nickName
          required: true
          schema:
            type: string
          description: NickName del usuario
      responses:
        '200':
          description: Lista de seguidores obtenida exitosamente
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor

  /users/{nickName}/following:
    get:
      summary: Obtener todos los usuarios seguidos por un usuario
      tags:
        - Followers
      parameters:
        - in: path
          name: nickName
          required: true
          schema:
            type: string
          description: NickName del usuario
      responses:
        '200':
          description: Lista de usuarios seguidos obtenida exitosamente
        '404':
          description: Usuario no encontrado
        '500':
          description: Error interno del servidor

  /users/{nickName}/following/{followedNickName}:
    post:
      summary: Un usuario sigue a otro usuario
      tags:
        - Followers
      parameters:
        - in: path
          name: nickName
          required: true
          schema:
            type: string
          description: NickName del usuario seguidor
        - in: path
          name: followedNickName
          required: true
          schema:
            type: string
          description: NickName del usuario a seguir
      responses:
        '201':
          description: Usuario seguido con éxito
        '400':
          description: Un usuario no puede seguirse a sí mismo o la relación ya existe
        '404':
          description: Usuario seguidor o seguido no encontrado
        '500':
          description: Error interno del servidor
    delete:
      summary: Un usuario deja de seguir a otro usuario
      tags:
        - Followers
      parameters:
        - in: path
          name: nickName
          required: true
          schema:
            type: string
          description: NickName del usuario seguidor
        - in: path
          name: followedNickName
          required: true
          schema:
            type: string
          description: NickName del usuario a dejar de seguir
      responses:
        '200':
          description: Se dejó de seguir al usuario exitosamente
        '404':
          description: Relación de seguimiento no encontrada
        '500':
          description: Error interno del servidor

  # -------------------------------------------------------------------
  # RECURSO: PUBLICACIONES (/posts)
  # -------------------------------------------------------------------
  /posts:
    get:
      summary: Obtener todas las publicaciones
      description: Retorna el listado completo de publicaciones. Utiliza caché en memoria con Redis (60 segundos).
      tags:
        - Posts
      responses:
        '200':
          description: Lista de publicaciones obtenida exitosamente (desde Redis o MongoDB)
        '500':
          description: Error interno del servidor
    post:
      summary: Crear una nueva publicación (JSON o Multipart/form-data)
      description: Permite adjuntar imágenes por URL o archivos locales vía Multer. Invalida la caché de Redis.
      tags:
        - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - descripcion
                - userId
              properties:
                descripcion:
                  type: string
                  example: "Estudiando para el TP2 de Persistencia"
                userId:
                  type: string
                  example: "60d5ecb8b487343568912345"
                tagIds:
                  type: array
                  items:
                    type: string
                  example: ["60d5ecb8b487343568911111"]
                imagenesUrls:
                  type: array
                  items:
                    type: string
                  example: ["https://example.com/imagen.jpg"]
          multipart/form-data:
            schema:
              type: object
              required:
                - descripcion
                - userId
              properties:
                descripcion:
                  type: string
                userId:
                  type: string
                tagIds:
                  type: array
                imagenes:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Publicación creada exitosamente
        '400':
          description: Datos de entrada inválidos o referencias inexistentes
        '500':
          description: Error al crear la publicación

  /posts/{id}:
    get:
      summary: Obtener una publicación por su ID
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId de la publicación
      responses:
        '200':
          description: Publicación encontrada
        '400':
          description: ID de publicación con formato inválido
        '404':
          description: Publicación no encontrada
        '500':
          description: Error al obtener la publicación
    patch:
      summary: Modificar parcialmente una publicación
      description: Permite modificar la descripción, agregar/quitar imágenes y agregar/quitar etiquetas. Invalida la caché de Redis.
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId de la publicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                descripcion:
                  type: string
                  example: "Nueva descripción actualizada"
                nuevaImagenUrl:
                  type: string
                  example: "https://example.com/nueva.jpg"
                eliminarImagenId:
                  type: string
                  example: "60d5ecb8b487343568999999"
                agregarTagId:
                  type: string
                  example: "60d5ecb8b487343568911111"
                quitarTagId:
                  type: string
                  example: "60d5ecb8b487343568922222"
          multipart/form-data:
            schema:
              type: object
              properties:
                descripcion:
                  type: string
                eliminarImagenId:
                  type: string
                agregarTagId:
                  type: string
                quitarTagId:
                  type: string
                imagenes:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Publicación modificada exitosamente
        '400':
          description: Datos inválidos o etiqueta a agregar no existente
        '404':
          description: Publicación no encontrada
        '500':
          description: Error al modificar la publicación
    delete:
      summary: Eliminar una publicación por su ID
      description: Elimina el documento en MongoDB, limpia archivos de `/uploads/`, borra comentarios e invalida la caché de Redis.
      tags:
        - Posts
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId de la publicación a eliminar
      responses:
        '200':
          description: Publicación eliminada exitosamente
        '400':
          description: ID con formato inválido
        '404':
          description: Publicación no encontrada
        '500':
          description: Error al eliminar la publicación

  /posts/{postId}/comments:
    get:
      summary: Obtener los comentarios asociados a una publicación
      tags:
        - Posts
        - Comments
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
          description: ID ObjectId de la publicación
      responses:
        '200':
          description: Comentarios obtenidos exitosamente
        '400':
          description: ID de publicación inválido
        '404':
          description: Publicación no encontrada
        '500':
          description: Error interno del servidor

  # -------------------------------------------------------------------
  # RECURSO: ETIQUETAS (/tags)
  # -------------------------------------------------------------------
  /tags:
    get:
      summary: Obtener todas las etiquetas
      tags:
        - Tags
      responses:
        '200':
          description: Lista de etiquetas obtenida exitosamente
        '500':
          description: Error interno del servidor
    post:
      summary: Crear una nueva etiqueta
      tags:
        - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
                  example: "MongoDB"
      responses:
        '201':
          description: Etiqueta creada exitosamente
        '400':
          description: Etiqueta existente o nombre inválido
        '500':
          description: Error al crear la etiqueta

  /tags/{id}:
    get:
      summary: Buscar una etiqueta por su ID
      tags:
        - Tags
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId de la etiqueta
      responses:
        '200':
          description: Etiqueta encontrada
        '400':
          description: ID de etiqueta con formato inválido
        '404':
          description: Etiqueta no encontrada
        '500':
          description: Error al obtener la etiqueta
    delete:
      summary: Eliminar una etiqueta por su ID
      tags:
        - Tags
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId de la etiqueta a eliminar
      responses:
        '200':
          description: Etiqueta eliminada con éxito
        '400':
          description: ID con formato inválido
        '404':
          description: Etiqueta no encontrada
        '500':
          description: Error al eliminar la etiqueta

  # -------------------------------------------------------------------
  # RECURSO: COMENTARIOS (/comments)
  # -------------------------------------------------------------------
  /comments:
    get:
      summary: Obtener todos los comentarios visibles
      description: Retorna los comentarios dentro del período máximo configurado (COMMENT_MAX_MONTHS).
      tags:
        - Comments
      responses:
        '200':
          description: Lista de comentarios obtenida exitosamente
        '500':
          description: Error interno del servidor
    post:
      summary: Crear un nuevo comentario
      tags:
        - Comments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contenido
                - userId
                - postId
              properties:
                contenido:
                  type: string
                  example: "Excelente publicación"
                userId:
                  type: string
                  example: "60d5ecb8b487343568912345"
                postId:
                  type: string
                  example: "60d5ecb8b487343568967890"
      responses:
        '201':
          description: Comentario creado exitosamente
        '400':
          description: Datos inválidos o referencias no existentes en BDD
        '500':
          description: Error al crear el comentario

  /comments/{id}:
    get:
      summary: Obtener un comentario por su ID
      tags:
        - Comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId del comentario
      responses:
        '200':
          description: Comentario encontrado
        '400':
          description: ID de comentario con formato inválido
        '404':
          description: Comentario no encontrado o no visible
        '500':
          description: Error al obtener el comentario
    patch:
      summary: Actualizar el contenido de un comentario
      tags:
        - Comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId del comentario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contenido
              properties:
                contenido:
                  type: string
                  example: "Contenido del comentario actualizado"
      responses:
        '200':
          description: Contenido del comentario modificado con éxito
        '400':
          description: Datos de entrada inválidos
        '404':
          description: Comentario no encontrado
        '500':
          description: Error al actualizar el comentario
    delete:
      summary: Eliminar un comentario por su ID
      tags:
        - Comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID ObjectId del comentario a eliminar
      responses:
        '200':
          description: Comentario eliminado con éxito